<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nudibranch – living specimen</title>
  <style>
    html, body { margin: 0; height: 100%; background: #f2efe9; overflow: hidden; }
    canvas { display: block; touch-action: none; }   /* a finger stirs instead of scrolling */
    /* the field guide entry under the specimen (written by sketch.js) */
    .entry { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 20px 18px; color: #141414; pointer-events: none; }
    .entry p { margin: 0; max-width: 46em; }
    .entry-meta { font: 11px/1.6 Menlo, monospace; opacity: .75; }
    .entry-meta i { font-family: Georgia, serif; font-size: 13px; }
    .entry-line { font: italic 15px/1.4 Georgia, "Times New Roman", serif; margin: 4px 0 6px !important; }
    .entry-hint { opacity: .6; }
    @media (min-width: 640px) { .entry { padding: 0 28px 24px; } .entry-line { font-size: 17px; } }
  </style>
  <script src="../dragon-violet-v2/p5.js"></script>
</head>
<body>
<!-- open through a local server (the sketch loads the SVG), e.g.
     python3 -m http.server 8765   then   http://localhost:8765/living-specimen/ -->
<script src="specimens.js?v=1"></script>
<script src="sketch.js?v=16"></script>  <!-- raise ?v= after changes, Safari caches hard -->
</body>
</html>
